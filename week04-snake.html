<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>Snake</title>
</head>
<body>
  <h1>Snake</h1>
  <p class="html-link"><a href="index.html">Back to home</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
    var snake = { x: 0, y: 200 };
    var dx = 20;
    var dy = 0;
    var body = [];        // every square the snake is made of
    var snakeLength = 3;  // how long it is supposed to be
    var apple = { x: 200, y: 200 };
 
    var timer = setInterval(step, 100);   // was: setInterval(step, 100);
    
    function step() {
      snake.x = snake.x + dx;
      snake.y = snake.y + dy;
     
      if (snake.x > 380) { snake.x = 0; }
      if (snake.x < 0) { snake.x = 380; }
      if (snake.y > 380) { snake.y = 0; }
      if (snake.y < 0) { snake.y = 380; }

      for (var i = 0; i < body.length; i++) {
        if (body[i].x === snake.x && body[i].y === snake.y) {
          clearInterval(timer);
          alert("Game over");
          return;
        }
      }

      
      body.push({ x: snake.x, y: snake.y });
 
      while (body.length > snakeLength) {
        body.shift();
      }

      function drawBoard() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 400, 400);
 
        ctx.fillStyle = "#3ddc84";
        for (var i = 0; i < body.length; i++) {
          ctx.fillRect(body[i].x, body[i].y, 20, 20);
        }
        ctx.fillStyle = "red";
        ctx.fillRect(apple.x, apple.y, 20, 20);
        if (snake.x === apple.x && snake.y === apple.y) {
        snakeLength = snakeLength + 1;
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;
      }

      }
      drawBoard();
    }


    document.addEventListener("keydown", function(event) {
        if (event.key === "d") {
          dx = 20;
          dy = 0;
        }
        if (event.key === "a") {
          dx = -20;
          dy = 0;
        }
        if (event.key === "w") {
          dx = 0;
          dy = -20;          
        }
        if (event.key === "s") {
          dx = 0;
          dy = 20;
        }
     });
  </script>
</body>
</html>
